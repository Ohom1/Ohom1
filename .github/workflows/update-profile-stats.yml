name: Update Profile Stats

on:
  # Refresh automatically. GitHub contribution data itself can have some delay,
  # but this removes the README card cache from the critical path.
  schedule:
    - cron: "*/15 * * * *"

  push:
    paths:
      - "README.md"
      - ".github/workflows/update-profile-stats.yml"
      - "scripts/generate-streak.js"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&count_private=true"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide=html,css"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generate streak card from GitHub contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          OUTPUT: profile/streak.svg
        run: node scripts/generate-streak.js

      - name: Ensure local card paths in README
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("README.md")
          if path.exists():
              text = path.read_text(encoding="utf-8")

              # Replace external streak cards with local SVG
              text = re.sub(
                  r"https?://(?:streak-stats\.demolab\.com|github-readme-streak-stats\.herokuapp\.com)[^\s\"')]*",
                  "./profile/streak.svg",
                  text,
              )

              # Replace external stats cards with local SVGs
              text = re.sub(
                  r"https?://github-readme-stats\.vercel\.app/api/top-langs[^\s\"')]*",
                  "./profile/top-langs.svg",
                  text,
              )
              text = re.sub(
                  r"https?://github-readme-stats\.vercel\.app/api(?![/-]top-langs)[^\s\"')]*",
                  "./profile/stats.svg",
                  text,
              )

              # Clean any accidental query parameters on local profile SVG paths
              text = re.sub(
                  r"\./profile/(stats|streak|top-langs)\.svg[?&][^\s\"'>)]*",
                  r"./profile/\1.svg",
                  text,
              )

              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit updated cards and README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md profile/*.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update GitHub profile stats"
          git push
