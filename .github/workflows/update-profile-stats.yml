name: Update Profile Stats

on:
  push:
    branches:
      - main
    paths-ignore:
      - "profile/streak.svg"

  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate streak card from GitHub contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          OUTPUT: profile/streak.svg
        run: node scripts/generate-streak.js

      - name: Ensure local streak path in README
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("README.md")
          if path.exists():
              text = path.read_text(encoding="utf-8")

              # Replace external streak cards with local SVG
              text = re.sub(
                  r"https?://(?:streak-stats\.demolab\.com|github-readme-streak-stats\.herokuapp\.com)[^\s\"')]*",
                  "./profile/streak.svg",
                  text,
              )

              # Clean any accidental query parameters on local streak SVG path
              text = re.sub(
                  r"\./profile/streak\.svg[?&][^\s\"'>)]*",
                  r"./profile/streak.svg",
                  text,
              )

              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit updated cards and README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md profile/streak.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update GitHub profile stats"
          git push
